<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2731">
<title>Presensi PKL Teknik Pengelasan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --plat:#E4E9ED; --baja:#1B2731; --baja2:#55636F; --garis:#C5CDD4;
  --rompi:#FFC21A; --rompi-tua:#E0A800;
  --manila:#F3E4BC; --manila-garis:#D6C08A;
  --tinta:#2E3F9C; --merah:#B3342A; --hijau:#1E7D4F;
  --f:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fc:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--plat);color:var(--baja);font-family:var(--f);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:460px;margin:0 auto;padding:16px 18px 40px}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tinta);outline-offset:2px}

/* Login */
.masthead{padding:40px 0 24px}
.masthead p{margin:0;color:var(--baja2);font-weight:500}
.masthead h1{margin:2px 0 0;font-family:var(--fc);font-weight:700;font-size:44px;line-height:1;letter-spacing:.5px}
.panel{background:#fff;border:1px solid var(--garis);border-radius:12px;padding:18px;display:grid;gap:14px}
label{display:grid;gap:6px;font-weight:600;font-size:15px}
input[type=text],input[type=password],textarea{width:100%;border:1.5px solid var(--garis);border-radius:8px;padding:12px;background:#fff;font-size:17px}
input:focus,textarea:focus{border-color:var(--tinta);outline:none}
.kecil{font-size:14px;color:var(--baja2)}

/* Tombol */
.btn{display:block;width:100%;border:0;border-radius:10px;padding:14px 16px;font-family:var(--fc);font-weight:700;font-size:22px;letter-spacing:.3px;cursor:pointer}
.btn.utama{background:var(--rompi);color:var(--baja);box-shadow:inset 0 -3px 0 var(--rompi-tua)}
.btn.utama:active{transform:translateY(1px)}
.btn.utama:disabled{background:#CDD3D8;color:var(--baja2);box-shadow:none;cursor:default}
.btn.kedua{background:transparent;border:1.5px solid var(--baja);color:var(--baja)}
.besar{min-height:64px;font-size:24px}
.link{background:none;border:0;color:var(--baja2);font-weight:600;padding:8px;cursor:pointer;text-decoration:underline}

/* Home */
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.bar strong{display:block;font-size:17px}
.bar span{color:var(--baja2);font-size:14px}
.jam{margin:20px 0 0;font-family:var(--fc);font-weight:600;font-size:76px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.jam small{font-size:32px;color:var(--baja2);font-weight:500}
.tgl{margin:4px 0 18px;color:var(--baja2);font-weight:500}

/* Kartu absen */
.kartu{position:relative;background:var(--manila);border-radius:4px;padding:16px 16px 12px;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--manila-garis) 31px 32px);
  box-shadow:0 1px 0 var(--manila-garis),0 6px 14px -8px rgba(27,39,49,.35)}
.kartu::before{content:"";position:absolute;top:10px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--plat);box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.kartu-head{display:flex;justify-content:space-between;gap:10px;font-family:var(--fc);font-weight:600;font-size:17px;padding-top:12px;margin-bottom:10px}
.kartu-head span:last-child{text-align:right;color:#5C4E2A}
.slot{display:flex;align-items:center;justify-content:space-between;min-height:68px;border-top:1.5px solid var(--manila-garis)}
.slot-label{font-family:var(--fc);font-weight:600;font-size:20px;color:#5C4E2A}
.cap{font-family:var(--fc);font-weight:700;font-size:30px;line-height:1;color:var(--tinta);border:2.5px solid currentColor;border-radius:4px;padding:5px 10px 4px;transform:rotate(-4deg);text-align:center;opacity:.92}
.cap small{display:block;font-size:12px;font-weight:600;letter-spacing:.5px;margin-top:2px}
.cap.telat{color:var(--merah)}
.cap.kosong{color:#A8955F;border-style:dashed;border-width:1.5px;font-size:16px;font-weight:500;transform:none;padding:8px 12px}
.cap.baru{animation:cap .35s ease-out}
@keyframes cap{0%{transform:rotate(-4deg) scale(1.6);opacity:0}70%{transform:rotate(-4deg) scale(.95);opacity:1}100%{transform:rotate(-4deg) scale(1)}}
.kartu-kaki{margin:6px 0 0;font-size:13px;color:#5C4E2A}

.tantangan{margin:16px 0 0;padding:12px 14px;border-left:4px solid var(--rompi);background:#fff;border-radius:0 8px 8px 0}
.tantangan span{display:block;font-size:13px;color:var(--baja2)}
.tantangan strong{font-size:19px}
#btnAksi{margin-top:16px}
.msg{margin:10px 0 0;font-weight:500;min-height:1.4em}
.msg.salah{color:var(--merah)}
.msg.ok{color:var(--hijau)}

h2.sub{font-family:var(--fc);font-weight:600;font-size:22px;margin:28px 0 8px}
.riwayat{list-style:none;margin:0;padding:0;border-top:1px solid var(--garis)}
.riwayat li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--garis)}
.r-utama{font-weight:600}
.r-jam{font-family:var(--fc);font-weight:600;font-size:20px;text-align:right}
.r-ket{grid-column:1/-1;font-size:14px;color:var(--baja2);overflow-wrap:anywhere}
.tanda{display:inline-block;font-size:12px;font-weight:600;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:1px}
.tanda.telat{background:#F6DCD8;color:var(--merah)}
.tanda.luar{background:#FFF0C2;color:#7A5A00}
.kosong-teks{color:var(--baja2);padding:12px 0}

/* Lembar bawah */
.layar{position:fixed;inset:0;background:rgba(27,39,49,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.lembar{background:var(--plat);width:100%;max-width:460px;max-height:94vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0))}
.lembar h3{margin:0 0 4px;font-family:var(--fc);font-size:26px;font-weight:700}
.lembar .info{margin:0 0 12px;color:var(--baja2);font-size:15px}
.kamera{position:relative;background:#000;border-radius:10px;overflow:hidden;aspect-ratio:3/4}
.kamera video,.kamera img{width:100%;height:100%;object-fit:cover;display:block}
.kamera video{transform:scaleX(-1)}
.pose{position:absolute;top:10px;left:10px;right:10px;background:var(--rompi);color:var(--baja);font-weight:600;padding:8px 10px;border-radius:6px;text-align:center}
.baris-tombol{display:grid;gap:10px;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0}
.chip span{display:block;border:1.5px solid var(--garis);background:#fff;border-radius:999px;padding:7px 12px;font-size:15px;font-weight:500;cursor:pointer}
.chip input:checked + span{background:var(--baja);color:#fff;border-color:var(--baja)}
.chip input:focus-visible + span{outline:3px solid var(--tinta);outline-offset:2px}
.hitung{font-size:13px;color:var(--baja2);text-align:right;margin-top:-6px}
.hitung.cukup{color:var(--hijau)}
textarea{min-height:110px;resize:vertical}

#loading{position:fixed;inset:0;background:rgba(228,233,237,.88);display:flex;align-items:center;justify-content:center;z-index:20}
#loading p{font-family:var(--fc);font-size:24px;font-weight:600}
@media (prefers-reduced-motion:reduce){.cap.baru{animation:none}}
</style>
</head>
<body>
<main class="wrap">

  <!-- LOGIN -->
  <section id="vLogin" hidden>
    <div class="masthead">
      <p>Teknik Pengelasan, SMKN 1 Duduksampeyan</p>
      <h1>Presensi PKL</h1>
    </div>
    <form id="fLogin" class="panel" novalidate>
      <label>NIS
        <input id="inNis" type="text" inputmode="numeric" autocomplete="username" required>
      </label>
      <label>PIN
        <input id="inPin" type="password" inputmode="numeric" autocomplete="current-password" required>
      </label>
      <button class="btn utama" type="submit">Masuk</button>
      <p class="msg salah" id="loginMsg" role="alert"></p>
    </form>
    <p class="kecil">Lupa PIN? Hubungi guru pembimbing PKL.</p>
  </section>

  <!-- BERANDA -->
  <section id="vHome" hidden>
    <header class="bar">
      <div><strong id="hNama"></strong><span id="hKelas"></span></div>
      <button id="btnKeluar" class="link" type="button">Keluar</button>
    </header>

    <p class="jam" aria-hidden="true"><span id="jamBesar">--:--</span><small id="detik">:--</small></p>
    <p class="tgl" id="tglPanjang"></p>

    <article class="kartu" aria-label="Kartu absen hari ini">
      <div class="kartu-head"><span>Kartu absen</span><span id="kDudi"></span></div>
      <div class="slot"><span class="slot-label">Datang</span><span class="cap" id="capMasuk"></span></div>
      <div class="slot"><span class="slot-label">Pulang</span><span class="cap" id="capPulang"></span></div>
      <p class="kartu-kaki" id="kJadwal"></p>
    </article>

    <div id="tantanganBox" class="tantangan">
      <span>Pose foto hari ini</span>
      <strong id="tantangan"></strong>
    </div>

    <button id="btnAksi" class="btn utama besar" type="button"></button>
    <p class="msg" id="homeMsg" role="status"></p>

    <h2 class="sub">Riwayat terakhir</h2>
    <ul id="riwayat" class="riwayat"></ul>
  </section>
</main>

<!-- KAMERA (absen datang) -->
<div class="layar" id="sheetKamera" hidden role="dialog" aria-modal="true" aria-labelledby="judulKamera">
  <div class="lembar">
    <h3 id="judulKamera">Absen datang</h3>
    <p class="info" id="kLokasi"></p>
    <div class="kamera">
      <video id="video" playsinline muted autoplay></video>
      <img id="preview" alt="Foto yang akan dikirim" hidden>
      <div class="pose" id="kPose"></div>
    </div>
    <div class="baris-tombol">
      <button class="btn utama" id="btnJepret" type="button">Ambil foto</button>
      <button class="btn utama" id="btnKirimFoto" type="button" hidden>Kirim absen datang</button>
      <button class="btn kedua" id="btnUlang" type="button" hidden>Foto ulang</button>
      <button class="link" id="btnBatalKamera" type="button">Batal</button>
    </div>
  </div>
</div>

<!-- ABSEN PULANG -->
<div class="layar" id="sheetPulang" hidden role="dialog" aria-modal="true" aria-labelledby="judulPulang">
  <div class="lembar">
    <h3 id="judulPulang">Absen pulang</h3>
    <p class="info" id="pInfo"></p>
    <label for="inKegiatan">Apa yang kamu kerjakan hari ini?</label>
    <textarea id="inKegiatan" placeholder="Contoh: membantu fit-up rangka kanopi, grinding hasil las, latihan las fillet 2F di plat sisa."></textarea>
    <p class="hitung" id="hitung"></p>
    <p style="font-weight:600;margin:10px 0 0">Pekerjaan yang kamu lakukan</p>
    <div class="chips" id="chips"></div>
    <p class="msg salah" id="pulangMsg" role="alert"></p>
    <div class="baris-tombol">
      <button class="btn utama" id="btnKirimPulang" type="button">Kirim absen pulang</button>
      <button class="link" id="btnBatalPulang" type="button">Tutup</button>
    </div>
  </div>
</div>

<div id="loading" hidden><p id="loadingText"></p></div>

<script>
/* ===== GANTI dengan URL Web App dari Apps Script ===== */
const API_URL = 'TEMPEL_URL_WEB_APP_DI_SINI';

const $ = id => document.getElementById(id);
const S = { nis: '', pin: '', info: null, pos: null, foto: null, stream: null };

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

function deviceId() {
  let d = store.get('pkl_device');
  if (!d) {
    d = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
      : Date.now().toString(36) + Math.random().toString(36).slice(2);
    store.set('pkl_device', d);
  }
  return d;
}

async function api(action, extra = {}) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ action, nis: S.nis, pin: S.pin, deviceId: deviceId() }, extra))
  });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'Terjadi kesalahan.');
  return j.data;
}

function busy(t) { $('loading').hidden = !t; if (t) $('loadingText').textContent = t; }
function show(v) { ['vLogin', 'vHome'].forEach(x => $(x).hidden = x !== v); }
function pesan(t, salah) { const m = $('homeMsg'); m.textContent = t; m.className = 'msg ' + (salah ? 'salah' : 'ok'); }

/* ===== Jam ===== */
function tick() {
  const n = new Date();
  $('jamBesar').textContent = n.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', hour12: false }).replace('.', ':');
  $('detik').textContent = ':' + String(n.getSeconds()).padStart(2, '0');
  $('tglPanjang').textContent = n.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}
setInterval(tick, 1000); tick();

/* ===== Tampilan ===== */
function setCap(el, data, jenis, animasi) {
  el.className = 'cap';
  el.innerHTML = '';
  if (!data) { el.classList.add('kosong'); el.textContent = 'belum'; return; }
  el.append(data.jam);
  const s = document.createElement('small');
  if (jenis === 'masuk') {
    s.textContent = data.ketepatan === 'TERLAMBAT' ? 'terlambat' : 'tepat waktu';
    if (data.ketepatan === 'TERLAMBAT') el.classList.add('telat');
  } else {
    s.textContent = 'tercatat';
  }
  el.append(s);
  if (animasi) el.classList.add('baru');
}

function render(animasi) {
  const i = S.info, h = i.hariIni, d = i.dudi;
  $('hNama').textContent = i.profil.nama;
  $('hKelas').textContent = i.profil.kelas + ', NIS ' + i.profil.nis;
  $('kDudi').textContent = d.nama;
  $('kJadwal').textContent = 'Jam masuk ' + d.jamMasuk + ', absen pulang mulai ' + d.jamPulang;
  setCap($('capMasuk'), h.masuk, 'masuk', animasi === 'masuk');
  setCap($('capPulang'), h.pulang, 'pulang', animasi === 'pulang');

  $('tantanganBox').hidden = !!h.masuk;
  $('tantangan').textContent = i.tantangan;

  const b = $('btnAksi');
  b.disabled = false;
  if (!h.masuk) { b.textContent = 'Absen datang'; b.onclick = mulaiDatang; }
  else if (!h.pulang) { b.textContent = 'Absen pulang'; b.onclick = bukaPulang; }
  else { b.textContent = 'Absensi hari ini lengkap'; b.disabled = true; b.onclick = null; }

  const ul = $('riwayat'); ul.innerHTML = '';
  if (!i.riwayat.length) {
    const li = document.createElement('li'); li.className = 'kosong-teks';
    li.textContent = 'Belum ada absensi. Riwayat akan muncul setelah absen pertama.'; ul.append(li);
  }
  i.riwayat.forEach(r => {
    const li = document.createElement('li');
    const a = document.createElement('span'); a.className = 'r-utama';
    a.textContent = fmtTgl(r.tgl) + ', ' + (r.jenis === 'MASUK' ? 'datang' : 'pulang');
    if (r.ketepatan === 'TERLAMBAT') a.append(tanda('terlambat', 'telat'));
    if (r.lokasi === 'LUAR RADIUS') a.append(tanda('luar radius', 'luar'));
    const j = document.createElement('span'); j.className = 'r-jam'; j.textContent = r.jam;
    li.append(a, j);
    if (r.kegiatan) { const k = document.createElement('span'); k.className = 'r-ket'; k.textContent = r.kegiatan; li.append(k); }
    ul.append(li);
  });
}
function tanda(t, c) { const s = document.createElement('span'); s.className = 'tanda ' + c; s.textContent = t; return s; }
function fmtTgl(s) {
  const d = new Date(s + 'T00:00:00');
  return isNaN(d) ? s : d.toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short' });
}

async function refresh(animasi) { S.info = await api('login'); render(animasi); }

/* ===== Lokasi ===== */
function ambilLokasi() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('Perangkat ini tidak mendukung GPS.'));
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lng: p.coords.longitude, akurasi: Math.round(p.coords.accuracy) }),
      e => rej(new Error(e.code === 1
        ? 'Akses lokasi ditolak. Izinkan lokasi untuk situs ini di pengaturan browser, lalu coba lagi.'
        : 'Lokasi belum terbaca. Nyalakan GPS dan coba lagi di tempat yang lebih terbuka.')),
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  });
}
function jarakM(a, b, c, d) {
  const R = 6371000, r = x => x * Math.PI / 180;
  const h = Math.sin(r(c - a) / 2) ** 2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(r(d - b) / 2) ** 2;
  return Math.round(2 * R * Math.asin(Math.sqrt(h)));
}
function teksJarak(pos) {
  const d = S.info.dudi;
  if (!d.lat && !d.lng) return 'Akurasi GPS ±' + pos.akurasi + ' m';
  const j = jarakM(pos.lat, pos.lng, d.lat, d.lng);
  return 'Jarak ke ' + d.nama + ' sekitar ' + j + ' m' + (j > d.radius ? ', di luar area tempat PKL' : '') + ' (GPS ±' + pos.akurasi + ' m)';
}

/* ===== Absen datang ===== */
async function mulaiDatang() {
  pesan('');
  try {
    busy('Membaca lokasi...');
    S.pos = await ambilLokasi();
    busy(false);
    await bukaKamera();
  } catch (e) { busy(false); pesan(e.message, true); }
}

async function bukaKamera() {
  $('kLokasi').textContent = teksJarak(S.pos);
  $('kPose').textContent = 'Pose: ' + S.info.tantangan;
  modePreview(false);
  $('sheetKamera').hidden = false;
  try {
    S.stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false
    });
    const v = $('video'); v.srcObject = S.stream; await v.play();
  } catch (e) {
    tutupKamera();
    pesan('Kamera tidak bisa dibuka. Izinkan akses kamera untuk situs ini, lalu coba lagi.', true);
  }
}

function tutupKamera() {
  if (S.stream) { S.stream.getTracks().forEach(t => t.stop()); S.stream = null; }
  $('sheetKamera').hidden = true;
}

function modePreview(on) {
  $('video').hidden = on; $('preview').hidden = !on;
  $('btnJepret').hidden = on; $('btnUlang').hidden = !on; $('btnKirimFoto').hidden = !on;
  $('kPose').hidden = on;
}

function jepret() {
  const v = $('video');
  if (!v.videoWidth) return;
  const W = 720, H = Math.round(W * v.videoHeight / v.videoWidth);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.drawImage(v, 0, 0, W, H);
  // Cap waktu & lokasi di foto
  const n = new Date();
  const lines = [
    S.info.profil.nama + ' (' + S.info.profil.nis + ')',
    n.toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }) + ' | ' + S.info.tantangan,
    S.pos.lat.toFixed(6) + ', ' + S.pos.lng.toFixed(6) + ' ±' + S.pos.akurasi + ' m'
  ];
  const fs = Math.round(W / 32), pad = Math.round(fs * .6), lh = Math.round(fs * 1.3);
  const bh = lines.length * lh + pad * 2;
  x.fillStyle = 'rgba(0,0,0,.55)'; x.fillRect(0, H - bh, W, bh);
  x.fillStyle = '#fff'; x.font = '600 ' + fs + 'px Barlow, sans-serif';
  lines.forEach((l, i) => x.fillText(l, pad, H - bh + pad + lh * (i + 1) - Math.round(lh * .25)));
  S.foto = c.toDataURL('image/jpeg', 0.6);
  $('preview').src = S.foto;
  modePreview(true);
}

async function kirimDatang() {
  try {
    busy('Mengirim absen datang...');
    const r = await api('masuk', { lat: S.pos.lat, lng: S.pos.lng, akurasi: S.pos.akurasi, foto: S.foto });
    tutupKamera();
    await refresh('masuk');
    pesan('Absen datang tercatat pukul ' + r.jam + '.' +
      (r.lokasi === 'LUAR RADIUS' ? ' Lokasimu di luar area tempat PKL dan akan dicek guru pembimbing.' : ''));
  } catch (e) {
    tutupKamera(); pesan(e.message, true);
  } finally { busy(false); }
}

/* ===== Absen pulang ===== */
function bukaPulang() {
  pesan('');
  const i = S.info;
  $('pInfo').textContent = 'Absen pulang bisa dikirim mulai pukul ' + i.dudi.jamPulang + '. Isian ini jadi bahan laporan PKL-mu.';
  const box = $('chips');
  if (!box.childElementCount) {
    i.kompetensi.forEach(k => {
      const l = document.createElement('label'); l.className = 'chip';
      const inp = document.createElement('input'); inp.type = 'checkbox'; inp.value = k;
      const s = document.createElement('span'); s.textContent = k;
      l.append(inp, s); box.append(l);
    });
  }
  $('inKegiatan').value = store.get('pkl_draft_' + i.tanggal) || '';
  hitung();
  $('pulangMsg').textContent = '';
  $('sheetPulang').hidden = false;
}

function hitung() {
  const n = $('inKegiatan').value.trim().length, min = S.info.minKarakter;
  const h = $('hitung');
  h.textContent = n >= min ? n + ' karakter' : n + ' dari minimal ' + min + ' karakter';
  h.className = 'hitung' + (n >= min ? ' cukup' : '');
  store.set('pkl_draft_' + S.info.tanggal, $('inKegiatan').value);
}

async function kirimPulang() {
  const keg = $('inKegiatan').value.trim();
  const komp = [...document.querySelectorAll('#chips input:checked')].map(i => i.value);
  const m = $('pulangMsg');
  if (keg.length < S.info.minKarakter) { m.textContent = 'Tulis kegiatanmu minimal ' + S.info.minKarakter + ' karakter.'; return; }
  if (!komp.length) { m.textContent = 'Pilih minimal satu pekerjaan yang kamu lakukan.'; return; }
  try {
    busy('Membaca lokasi...');
    const pos = await ambilLokasi();
    busy('Mengirim absen pulang...');
    const r = await api('pulang', Object.assign({ kegiatan: keg, kompetensi: komp }, pos));
    $('sheetPulang').hidden = true;
    store.del('pkl_draft_' + S.info.tanggal);
    $('inKegiatan').value = '';
    document.querySelectorAll('#chips input').forEach(i => i.checked = false);
    await refresh('pulang');
    pesan('Absen pulang tercatat pukul ' + r.jam + '. Hati-hati di jalan.');
  } catch (e) { m.textContent = e.message; }
  finally { busy(false); }
}

/* ===== Login ===== */
$('fLogin').addEventListener('submit', async ev => {
  ev.preventDefault();
  S.nis = $('inNis').value.trim(); S.pin = $('inPin').value.trim();
  const m = $('loginMsg'); m.textContent = '';
  if (!S.nis || !S.pin) { m.textContent = 'Isi NIS dan PIN.'; return; }
  try {
    busy('Masuk...');
    await refresh();
    store.set('pkl_cred', JSON.stringify({ nis: S.nis, pin: S.pin }));
    show('vHome');
  } catch (e) { m.textContent = e.message; }
  finally { busy(false); }
});

$('btnKeluar').onclick = () => { store.del('pkl_cred'); S.nis = S.pin = ''; S.info = null; $('fLogin').reset(); show('vLogin'); };
$('btnJepret').onclick = jepret;
$('btnUlang').onclick = () => modePreview(false);
$('btnKirimFoto').onclick = kirimDatang;
$('btnBatalKamera').onclick = tutupKamera;
$('btnBatalPulang').onclick = () => { $('sheetPulang').hidden = true; };
$('btnKirimPulang').onclick = kirimPulang;
$('inKegiatan').addEventListener('input', hitung);

/* Muat ulang data saat aplikasi dibuka kembali (misal pindah hari) */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && S.info && $('sheetKamera').hidden && $('sheetPulang').hidden) refresh().catch(() => {});
});

(async function init() {
  if (API_URL.indexOf('TEMPEL') === 0) {
    show('vLogin'); $('loginMsg').textContent = 'URL Web App belum diisi di index.html.'; return;
  }
  const c = store.get('pkl_cred');
  if (c) {
    try {
      const o = JSON.parse(c); S.nis = o.nis; S.pin = o.pin;
      busy('Memuat...'); await refresh(); show('vHome'); return;
    } catch (e) { store.del('pkl_cred'); }
    finally { busy(false); }
  }
  show('vLogin');
})();
</script>
